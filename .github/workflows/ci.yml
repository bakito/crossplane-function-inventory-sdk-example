name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Setup Crossplane
        run: task setup

      - name: Generate
        run: task generate

      - name: Format
        run: task format

      - name: Check for diff
        run: |
          git diff --exit-code || (echo "Generated files are out of sync. Please run 'task generate' and 'task format', then commit the changes." && exit 1)

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Build
        run: task build
